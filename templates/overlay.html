<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Goddess AI | OBS Overlay</title>
    <style>
        /* 
          OBS SPECIFIC SETTINGS 
          The background MUST be transparent so the stream shows behind it.
          Overflow is hidden to prevent ugly scrollbars in OBS.
        */
        body {
            margin: 0;
            overflow: hidden; 
            background-color: transparent; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            padding-top: 50px; /* Distance from the top of the stream */
        }

        .alert-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0; /* Hidden by default */
        }

        .alert-box {
            background: linear-gradient(135deg, #1e1e24, #2a2a32);
            border: 3px solid #a855f7;
            border-radius: 16px;
            padding: 20px 40px;
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(168, 85, 247, 0.4);
            min-width: 350px;
            max-width: 600px;
            
            /* The Entrance Animation */
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Specific event styling (Optional: can be expanded later) */
        .alert-box.superChatEvent { border-color: #facc15; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(250, 204, 21, 0.4); }
        .alert-box.newSponsorEvent { border-color: #22c55e; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(34, 197, 94, 0.4); }

        .alert-author { 
            font-size: 28px; 
            font-weight: bold; 
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .alert-amount { 
            color: #4ade80; 
            font-size: 26px; 
            font-weight: 900; 
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .alert-message { 
            font-size: 20px; 
            margin-top: 10px; 
            font-style: italic; 
            color: #e5e7eb;
            line-height: 1.4;
        }
        
        /* Animation Keyframes */
        @keyframes popIn {
            0% { transform: scale(0.5) translateY(-50px); opacity: 0; }
            70% { transform: scale(1.05) translateY(0); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(0.8) translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- This is the empty canvas where alerts will be injected by JavaScript -->
    <div id="alert-wrapper" class="alert-container"></div>

    <script>
        // ---------------------------------------------------------
        // WEBSOCKET CONNECTION
        // ---------------------------------------------------------
        // Dynamically figure out if the server is running on ws:// (local) or wss:// (Railway)
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/overlay/{{ sync_code }}`;
        
        let ws;
        let alertQueue = [];
        let isPlaying = false;

        function connectWebSocket() {
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log("🟢 OBS Widget Connected to Goddess AI Backend");
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // If the backend sends an alert, push it to the queue
                if (data.type === "alert") {
                    alertQueue.push(data);
                    
                    // If the queue isn't currently playing something, start it up!
                    if (!isPlaying) {
                        playNextAlert();
                    }
                }
            };

            ws.onclose = () => {
                console.log("🔴 OBS Widget Disconnected. Reconnecting in 5 seconds...");
                setTimeout(connectWebSocket, 5000); // Auto-reconnect makes the OBS widget bulletproof
            };
        }

        // ---------------------------------------------------------
        // ALERT QUEUE ENGINE
        // ---------------------------------------------------------
        function playNextAlert() {
            if (alertQueue.length === 0) {
                isPlaying = false;
                return;
            }
            
            isPlaying = true;
            
            // Pull the first alert out of the queue
            const alertData = alertQueue.shift();
            const wrapper = document.getElementById("alert-wrapper");
            
            // Build the HTML for the alert box
            let html = `<div class="alert-box ${alertData.event_type}" id="current-alert">`;
            
            html += `<div class="alert-author">${alertData.author}</div>`;
            
            // Only show the amount if it exists (e.g. Super Chats, not Memberships)
            if (alertData.amount && alertData.amount !== "") {
                html += `<div class="alert-amount">${alertData.amount}</div>`;
            }
            
            html += `<div class="alert-message">${alertData.message}</div>`;
            html += `</div>`;
            
            // Inject the HTML and make it visible (triggers the popIn CSS animation)
            wrapper.innerHTML = html;
            wrapper.style.opacity = 1;

            // Optional: Play a sound effect here! 
            // const audio = new Audio('/static/sounds/notification.mp3'); 
            // audio.play();

            // Wait 6 seconds, then animate the widget out
            setTimeout(() => {
                const box = document.getElementById("current-alert");
                if (box) {
                    box.style.animation = "slideOut 0.5s forwards";
                }
                
                // Wait for the slideOut animation to finish (0.5s), then clean up and check queue
                setTimeout(() => {
                    wrapper.style.opacity = 0;
                    wrapper.innerHTML = "";
                    
                    // Wait 1 second before showing the next alert (breathing room)
                    setTimeout(playNextAlert, 1000);
                }, 500);
                
            }, 6000); // 6000ms = 6 seconds on screen
        }

        // Boot up the connection as soon as OBS loads the page
        connectWebSocket();
    </script>
</body>
</html>
