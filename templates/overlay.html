<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Goddess AI | OBS Overlay</title>
    <style>
        /* 
          BASE OBS SETTINGS - DO NOT REMOVE 
          Keeps the container transparent and centered 
        */
        body {
            margin: 0;
            overflow: hidden; 
            background-color: transparent; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            padding-top: 50px;
        }
        .alert-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0; 
        }

        /* ---------------------------------------------------
           ADVANCED ANIMATION LIBRARY
           --------------------------------------------------- */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        @keyframes elasticBounce {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideIn {
            0% { transform: translateX(-100vw); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes liquidFill {
            0% { width: var(--prev-width, 0%); }
            100% { width: var(--new-width, 100%); }
        }

        /* ---------------------------------------------------
           DYNAMIC THEME ENGINE
           --------------------------------------------------- */
        
        {% if active_theme == 'custom' %}
            /* 💎 PRO: INJECT CUSTOM USER CSS */
            {{ custom_css | safe }}


        {% elif active_theme == 'cyberpunk' %}
            /* 🟡 CYBERPUNK THEME */
            .alert-box {
                background: #09090b;
                border: 4px solid #eab308;
                padding: 20px 40px;
                color: #fff;
                text-align: center;
                box-shadow: 8px 8px 0px #eab308; /* Hard shadow */
                min-width: 350px;
                text-transform: uppercase;
                animation: glitchIn 0.3s forwards;
            }
            .alert-author { font-size: 28px; font-weight: 900; color: #eab308; letter-spacing: 2px; }
            .alert-amount { font-size: 26px; font-weight: bold; background: #eab308; color: #000; padding: 2px 10px; display: inline-block; margin-top: 5px; }
            .alert-message { font-size: 20px; margin-top: 10px; border-top: 2px dashed #333; padding-top: 10px; font-family: monospace; }
            
            @keyframes glitchIn {
                0% { transform: scale(0.8) skewX(20deg); opacity: 0; }
                100% { transform: scale(1) skewX(0deg); opacity: 1; }
            }
            @keyframes slideOut {
                0% { transform: translateX(0); opacity: 1; }
                100% { transform: translateX(100vw); opacity: 0; }
            }


        {% elif active_theme == 'minimal' %}
            /* ⚪ MINIMAL THEME */
            .alert-box {
                background: rgba(255, 255, 255, 0.95);
                border-radius: 8px;
                padding: 15px 35px;
                color: #111;
                text-align: center;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                min-width: 300px;
                animation: fadeIn 0.8s ease-out forwards;
            }
            .alert-author { font-size: 24px; font-weight: 600; }
            .alert-amount { color: #16a34a; font-size: 22px; font-weight: bold; }
            .alert-message { font-size: 18px; margin-top: 8px; font-weight: 300; }
            
            @keyframes fadeIn {
                0% { opacity: 0; transform: translateY(-20px); }
                100% { opacity: 1; transform: translateY(0); }
            }
            @keyframes slideOut {
                0% { opacity: 1; transform: translateY(0); }
                100% { opacity: 0; transform: translateY(-20px); }
            }


        {% else %}
            /* 🟣 DEFAULT NEON THEME & SMART BUILDER BASE */
            :root {
                /* Variables that the Visual Builder will update */
                --alert-bg-color: linear-gradient(135deg, #1e1e24, #2a2a32);
                --alert-border-color: #a855f7;
                --alert-border-radius: 16px;
                --alert-anim-in: popIn;
            }
            
            .alert-box {
                background: var(--alert-bg-color);
                border: 3px solid var(--alert-border-color);
                border-radius: var(--alert-border-radius);
                padding: 20px 40px;
                color: white;
                text-align: center;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(168, 85, 247, 0.4);
                min-width: 350px;
                max-width: 600px;
                animation: var(--alert-anim-in) 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
                backdrop-filter: blur(10px);
                transform: translateZ(0); /* Force GPU */
                will-change: transform, opacity;
            }
            .alert-box.superChatEvent { border-color: #facc15; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(250, 204, 21, 0.4); }
            .alert-box.newSponsorEvent { border-color: #22c55e; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(34, 197, 94, 0.4); }

            .alert-author { font-size: 28px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
            .alert-amount { color: #4ade80; font-size: 26px; font-weight: 900; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
            .alert-message { font-size: 20px; margin-top: 10px; font-style: italic; color: #e5e7eb; line-height: 1.4; }
            .avatar-layer { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px auto; border: 2px solid white; display: none; }
            .show-avatar .avatar-layer { display: block; }
            
            @keyframes popIn {
                0% { transform: scale(0.5) translateY(-50px); opacity: 0; }
                70% { transform: scale(1.05) translateY(0); opacity: 1; }
                100% { transform: scale(1) translateY(0); opacity: 1; }
            }
            @keyframes slideOut {
                0% { transform: scale(1) translateY(0); opacity: 1; }
                100% { transform: scale(0.8) translateY(-100px); opacity: 0; }
            }
        {% endif %}

        /* ---------------------------------------------------
           GOAL WIDGET SYSTEM
           --------------------------------------------------- */
        #goals-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .goal-widget {
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            border: 2px solid #333;
            padding: 10px;
            width: 100%;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        .goal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }
        .goal-bar-bg {
            width: 100%;
            height: 24px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .goal-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #9333ea, #4f46e5);
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(147, 51, 234, 0.8);
        }
    </style>
</head>
<body>

    <div id="alert-wrapper" class="alert-container"></div>
    
    <div id="goals-container">
        <!-- Example structure of a goal. The backend will spawn these dynamically. -->
        <!-- <div class="goal-widget" id="goal-1">
            <div class="goal-header">
                <span id="goal-title-1">Sub Goal</span>
                <span id="goal-text-1">0 / 100</span>
            </div>
            <div class="goal-bar-bg">
                <div class="goal-bar-fill" id="goal-fill-1"></div>
            </div>
        </div> -->
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/overlay/{{ sync_code }}`;
        
        let ws;
        let alertQueue = [];
        let isPlaying = false;

        function connectWebSocket() {
            ws = new WebSocket(wsUrl);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // EVENT: Alert (Uses queue)
                if (data.type === "alert") {
                    alertQueue.push(data);
                    if (!isPlaying) playNextAlert();
                }
                // EVENT: Goal Update (Instant update)
                else if (data.type === "goal_update") {
                    updateGoalBar(data.goal_id, data.current, data.target);
                }
                // EVENT: Visual Config Update (Instant apply)
                else if (data.type === "config_update") {
                    applyVisualConfig(data.config);
                }
            };
            ws.onclose = () => setTimeout(connectWebSocket, 5000);
        }

        // --- NEW: Iframe PostMessage Listener for Live Preview ---
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'preview_config') {
                applyVisualConfig(event.data.config);
            }
        });

        // --- NEW: Update CSS Variables dynamically ---
        function applyVisualConfig(config) {
            const root = document.documentElement;
            if (config.border_radius !== undefined) root.style.setProperty('--alert-border-radius', config.border_radius + 'px');
            if (config.animation_in) root.style.setProperty('--alert-anim-in', config.animation_in);
            
            // Toggle avatar class on wrapper (which we will add inside playNextAlert)
            if (config.show_avatar) {
                document.body.classList.add('show-avatar');
            } else {
                document.body.classList.remove('show-avatar');
            }
        }

        // --- NEW: Goal Bar Engine ---
        function updateGoalBar(id, current, target) {
            let percentage = (current / target) * 100;
            if (percentage > 100) percentage = 100;
            
            const fillBar = document.getElementById(`goal-fill-${id}`);
            if (fillBar) {
                fillBar.style.width = `${percentage}%`;
                document.getElementById(`goal-text-${id}`).innerText = `${current} / ${target}`;
            }
        }

        function playNextAlert() {
            if (alertQueue.length === 0) {
                isPlaying = false;
                return;
            }
            
            isPlaying = true;
            const alertData = alertQueue.shift();
            const wrapper = document.getElementById("alert-wrapper");
            
            // Build modular HTML
            let html = `<div class="alert-box ${alertData.event_type}" id="current-alert">`;
            
            // New optional avatar layer
            html += `<img src="https://ui-avatars.com/api/?name=${alertData.author}&background=random" class="avatar-layer" />`;
            
            html += `<div class="alert-author">${alertData.author}</div>`;
            if (alertData.amount && alertData.amount !== "") {
                html += `<div class="alert-amount">${alertData.amount}</div>`;
            }
            html += `<div class="alert-message">${alertData.message}</div></div>`;
            
            wrapper.innerHTML = html;
            wrapper.style.opacity = 1;

            setTimeout(() => {
                const box = document.getElementById("current-alert");
                if (box) box.style.animation = "slideOut 0.5s forwards";
                setTimeout(() => {
                    wrapper.style.opacity = 0;
                    wrapper.innerHTML = "";
                    setTimeout(playNextAlert, 1000);
                }, 500);
            }, 6000); 
        }

        connectWebSocket();
    </script>
</body>
</html>
