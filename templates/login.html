<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Goddess AI | Sign in</title>
<style>body{font-family:system-ui;background:#09090b;color:#fff;display:grid;min-height:100vh;place-items:center;margin:0}.card{width:min(400px,90vw);padding:2rem;background:#18181b;border-radius:12px}input{box-sizing:border-box;width:100%;padding:.75rem;margin:.5rem 0 1rem}button{width:100%;padding:.75rem;background:#a855f7;color:#fff;border:0;border-radius:6px;font-weight:bold}.error{color:#fca5a5}</style></head>
<body><main class="card"><h1>Goddess AI</h1><p>Dashboard sign in</p>{% if error %}<p class="error">Invalid username or password.</p>{% endif %}<form method="post" action="/login"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form></main></body></html>
